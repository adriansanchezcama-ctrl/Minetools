!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineTools</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <header>
        <h1>⛏️ MineTools</h1>
        <p>Herramientas sencillas para Minecraft</p>
    </header>

    <main>
        <section class="card">
            <h2>📦 Conversor de bloques a stacks</h2>

            <input
                type="number"
                id="bloques"
                placeholder="Número de bloques"
                min="0"
            >

            <button onclick="convertir()">Calcular</button>

            <p id="resultado"></p>
        </section>
    </main>

    <footer>
        <p>MineTools • Herramientas para Minecraft</p>
    </footer>

    <script src="script.js"></script>
</body>
</html><section class="card">
    <h2>🌎 Conversor Nether ↔ Overworld</h2>

    <input type="number" id="x" placeholder="Coordenada X">
    <input type="number" id="z" placeholder="Coordenada Z">

    <button onclick="netherAOverworld()">Nether → Overworld</button>
    <button onclick="overworldANether()">Overworld → Nether</button>

    <p id="coordenadas"></p>
</section>
